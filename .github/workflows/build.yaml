name: Build Image

on:
  workflow_call:
    inputs:
      version:
        description: Image version to publish
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Login to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: nayleen
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and Push Docker Images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          cache-from: type=registry,ref=ghcr.io/nayleen/bunny-ddns:${{ matrix.arch }}-cache
          cache-to: type=registry,ref=ghcr.io/nayleen/bunny-ddns:${{ matrix.arch }}-cache,mode=max
          context: .
          push: true
          tags: ghcr.io/nayleen/bunny-ddns:${{ matrix.arch }}

  combine-manifests:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: nayleen
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine Manifests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker buildx imagetools create -t "ghcr.io/nayleen/bunny-ddns:${VERSION}" \
            ghcr.io/nayleen/bunny-ddns:amd64 \
            ghcr.io/nayleen/bunny-ddns:arm64
